# default webserv configuration
# run: ./webserv configs/default.conf

server {
	listen	                127.0.0.1:8080;
	server_name	            localhost;

	# maximum accepted size for a request body (plain bytes, K or M suffixes)
	client_max_body_size	4m;

	# custom error pages (relative to the working directory)
	error_page	400	errors/400.html;
	error_page	403	errors/403.html;
	error_page	404	errors/404.html;
	error_page	405	errors/405.html;
	error_page	413	errors/413.html;
	error_page	500	errors/500.html;
	error_page	502	errors/502.html;
	error_page	504	errors/504.html;

	# default site: static files served from www/
	location / {
		root		www;
		index		index.html;
		methods		GET POST DELETE;
		autoindex	off;
	}

	# python and shell scripts through CGI
	location /cgi-bin {
		root		www/cgi-bin;
		methods		GET POST;
		cgi_pass	.py	/usr/bin/python3;
		cgi_pass	.sh	/usr/bin/sh;
	}

	# client uploads are stored in www/upload/
	location /upload {
		root		www/upload;
		methods		GET POST DELETE;
		upload_path	www/upload;
	}

	# directory listing demo
	location /files {
		root		www/files;
		index		index.html;
		methods		GET;
		autoindex	on;
	}

	# HTTP redirection demo
	location /old {
		redirect	301	/;
	}

	# forbidden directory: no index file, listing disabled
	location /private {
		root		www/private;
		methods		GET;
		autoindex	off;
	}

	# cookies and session management demo
	location /session {
		root		www;
		methods		GET;
		session		on;
	}
}

# second site on another port, with a different root
server {
	listen	                127.0.0.1:8081;
	server_name	            secondary;

	client_max_body_size	1m;

	error_page	404	errors/404.html;

	location / {
		root		www/alt;
		index		index.html;
		methods		GET;
		autoindex	off;
	}
}
